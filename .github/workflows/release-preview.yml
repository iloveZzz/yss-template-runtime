name: Release preview

"on":
  push:
    tags:
      - "v3.0.0-rc.1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build"
        required: true
        default: "v3.0.0-rc.1"
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release target
    runs-on: ubuntu-22.04

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: test "${RELEASE_TAG}" = "v3.0.0-rc.1"

  build:
    name: Build ${{ matrix.target }}
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      - name: Configure musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=+crt-static -C link-arg=-static" >> "$GITHUB_ENV"

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests and compile target tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          if [ "${TARGET}" = "x86_64-unknown-linux-musl" ]; then
            cargo test --locked
            cargo test --locked --target "${TARGET}" --no-run
          else
            cargo test --locked --target "${TARGET}"
          fi

      - name: Verify Linux target runtime
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          uname -a
          uname -m
          rustc --version --verbose
          rustup show active-toolchain
          musl-gcc --version | head -1
          diagnostic_dir="${RUNNER_TEMP}/musl-runtime-diagnostics"
          mkdir -p "${diagnostic_dir}"
          printf '%s\n' 'fn main() { println!("hello"); }' > "${diagnostic_dir}/hello.rs"
          printf '%s\n' 'fn main() { let _args: Vec<String> = std::env::args().collect(); println!("args-ok"); }' > "${diagnostic_dir}/args.rs"
          printf '%s\n' 'use std::process::ExitCode; fn main() -> ExitCode { ExitCode::SUCCESS }' > "${diagnostic_dir}/exit.rs"
          for name in hello args exit; do
            rustc --target "${TARGET}" \
              -C linker=musl-gcc \
              -C target-feature=+crt-static \
              -C link-arg=-static \
              "${diagnostic_dir}/${name}.rs" \
              -o "${diagnostic_dir}/${name}"
            file "${diagnostic_dir}/${name}"
            "${diagnostic_dir}/${name}"
          done
          cargo build --locked --target "${TARGET}"
          binary="target/${TARGET}/debug/create-yss-spec"
          file "${binary}"
          readelf -h "${binary}"
          if readelf -l "${binary}" | grep -q 'INTERP'; then
            echo "expected a statically linked musl debug binary" >&2
            exit 1
          fi
          "${binary}" --help >/dev/null

      - name: Build Linux musl release binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Build macOS release binary
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Smoke test release binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -eu
          binary="target/${{ matrix.target }}/release/create-yss-spec"
          file "${binary}"
          if readelf -l "${binary}" | grep -q 'INTERP'; then
            echo "expected a statically linked musl release binary" >&2
            exit 1
          fi
          "${binary}" --help >/dev/null

      - name: Smoke test macOS release binary
        if: matrix.target == 'aarch64-apple-darwin'
        run: target/${{ matrix.target }}/release/create-yss-spec --help >/dev/null

      - name: Package preview asset
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          mkdir -p dist/stage
          cp "target/${TARGET}/release/create-yss-spec" dist/stage/create-yss-spec
          archive="create-yss-spec-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -czf "dist/${archive}" -C dist/stage create-yss-spec
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${archive}" > "dist/${archive}.sha256"
          else
            shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"
          fi
          {
            printf 'tag=%s\n' "${RELEASE_TAG}"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'target=%s\n' "${TARGET}"
            printf 'preview=true\n'
            printf 'signed=false\n'
          } > "dist/${archive}.build-info.txt"
          rm -rf dist/stage

      - name: Upload preview asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: Create GitHub draft Release
    needs: [validate-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Download preview assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums and asset set
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          targets="aarch64-apple-darwin x86_64-unknown-linux-musl"
          test "$(find dist -mindepth 1 -maxdepth 1 ! -type f | wc -l | tr -d ' ')" -eq 0
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          for target in ${targets}; do
            archive="create-yss-spec-${RELEASE_TAG}-${target}.tar.gz"
            checksum="${archive}.sha256"
            build_info="${archive}.build-info.txt"
            test -f "dist/${archive}"
            test -f "dist/${checksum}"
            test -f "dist/${build_info}"
            grep -Fx "tag=${RELEASE_TAG}" "dist/${build_info}"
            grep -Fx "target=${target}" "dist/${build_info}"
            grep -Fx "preview=true" "dist/${build_info}"
            grep -Fx "signed=false" "dist/${build_info}"
          done
          sha256sum -c dist/*.sha256

      - name: Create or update draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          tag="${RELEASE_TAG}"
          lookup_error="$(mktemp)"
          if release_state=$(gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease \
            --jq 'if .isDraft and .isPrerelease then "preview" else "non-preview" end' \
            2>"${lookup_error}"); then
            if [ "${release_state}" != "preview" ]; then
              echo "existing release ${tag} is not a draft prerelease; refusing to upload preview assets" >&2
              rm -f "${lookup_error}"
              exit 1
            fi
            rm -f "${lookup_error}"
            gh release upload "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              dist/*
          else
            if ! grep -qiE 'not found|could not find|HTTP 404' "${lookup_error}"; then
              cat "${lookup_error}" >&2
              rm -f "${lookup_error}"
              exit 1
            fi
            rm -f "${lookup_error}"
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --prerelease \
              --verify-tag \
              --title "create-yss-spec ${tag} - macOS/Linux preview" \
              --notes-file .github/release-notes/v3.0.0-rc.1.md \
              dist/*
          fi
